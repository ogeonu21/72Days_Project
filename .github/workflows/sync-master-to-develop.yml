name: Sync master to develop

on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-master-to-develop
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Open sync pull request if needed
        run: |
          ahead=$(gh api "repos/$REPO/compare/develop...master" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "develop already contains all master commits."
            exit 0
          fi

          existing=$(gh pr list --repo "$REPO" --state open \
            --base develop --head master --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Sync PR #$existing is already open."
            exit 0
          fi

          gh pr create --repo "$REPO" --base develop --head master \
            --title "Sync master into develop" \
            --body "Bring the latest master commits into develop."